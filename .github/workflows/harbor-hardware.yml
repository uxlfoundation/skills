name: harbor-hardware

on:
  workflow_dispatch:

jobs:
  sycl-gpu:
    runs-on: [self-hosted, linux, x64, uxl, sycl, gpu]
    timeout-minutes: 60
    env:
      HARBOR_TELEMETRY: "off"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install harbor==0.20.0
      - name: Capture host probes
        run: |
          sycl-ls || true
          cmake --version || true
          python skills/uxl-sycl-build-debug/scripts/sycl_probe.py
      - name: Run Harbor SYCL GPU oracle
        run: |
          harbor run \
            --path evaluation/harbor/tasks \
            --agent oracle \
            --include-task-name sycl-device-discovery \
            --job-name uxl-sycl-gpu-oracle \
            --jobs-dir harbor-jobs \
            --n-concurrent 1 \
            --yes
      - name: Require successful Harbor oracle results
        run: >-
          python scripts/check_harbor_job.py
          harbor-jobs/uxl-sycl-gpu-oracle/result.json
          --expected-trials 1
          --reward-floor 1.0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uxl-harbor-sycl-gpu
          path: harbor-jobs
          retention-days: 30
