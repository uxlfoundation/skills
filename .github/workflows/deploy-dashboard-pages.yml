name: deploy-evaluator-dashboard

on:
  pull_request:
    paths:
      - evaluation/dashboard/**
      - evaluation/harbor/suites.json
      - skills.yaml
      - .github/workflows/deploy-dashboard-pages.yml
  push:
    branches: [main]
    paths:
      - evaluation/dashboard/**
      - evaluation/harbor/suites.json
      - skills.yaml
      - .github/workflows/deploy-dashboard-pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: evaluation/dashboard/package-lock.json
      - name: Install dashboard dependencies
        working-directory: evaluation/dashboard
        run: npm ci
      - name: Lint dashboard
        working-directory: evaluation/dashboard
        run: npm run lint
      - name: Build and verify static dashboard
        working-directory: evaluation/dashboard
        env:
          GITHUB_PAGES: "true"
        run: npm run pages:build
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: evaluation/dashboard/dist/client

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy evaluator dashboard
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
