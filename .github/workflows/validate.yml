name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  catalog:
    runs-on: ubuntu-latest
    env:
      HARBOR_TELEMETRY: "off"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Validate agent configs with agnix
        uses: agent-sh/agnix@v0.36.0
        with:
          path: .
          config: .agnix.toml
          target: generic
          version: v0.36.0
          strict: "false"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate_catalog.py
      - run: python scripts/run_evals.py --validate
      - run: python scripts/validate_harbor_suites.py
      - run: python scripts/render_harbor_suites.py --check
      - run: python scripts/sync_harbor_answer_checkers.py --check
      - run: python -m unittest discover -s tests -p "test_*.py"
      - run: python -m pip install harbor==0.20.0
      - name: Validate Harbor comparison wrapper
        shell: pwsh
        run: >-
          & ./scripts/compare_harbor_skill.ps1
          -TaskName onemath-runtime-library-missing
          -SkillName uxl-onemath
          -PreviousRef HEAD
          -Agent oracle
          -Model oracle-smoke
          -ReasoningEffort ''
          -Attempts 1
          -JobPrefix ci-comparison-dry-run
          -DryRun
      - name: Run Harbor oracle smoke tests
        run: |
          harbor run \
            --path evaluation/harbor/tasks \
            --agent oracle \
            --include-task-name oneccl-divergent-collective-sequence \
            --include-task-name onedal-sklearn-or-native-kmeans \
            --include-task-name onednn-framework-blocked-layout \
            --include-task-name onedpl-missing-device-synchronization \
            --include-task-name onetbb-histogram-local-aggregation \
            --include-task-name onetbb-stable-compaction-scan \
            --include-task-name onemath-runtime-library-missing \
            --include-task-name performance-tiny-async-gpu-claim \
            --include-task-name sycl-cmake-compiler-cache \
            --job-name uxl-oracle-smoke \
            --jobs-dir harbor-jobs \
            --n-concurrent 4 \
            --yes
      - name: Require successful Harbor oracle results
        run: >-
          python scripts/check_harbor_job.py
          harbor-jobs/uxl-oracle-smoke/result.json
          --expected-trials 9
          --reward-floor 1.0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uxl-harbor-smoke
          path: harbor-jobs
          retention-days: 30
      - run: python scripts/generate_agent_wrappers.py --check
      - run: python scripts/check_links.py --timeout 15 --retries 1 --warn-transient-network-errors
      - run: python skills/uxl-sycl-build-debug/scripts/sycl_probe.py
      - run: |
          cat > /tmp/uxl_perf_smoke.csv <<'CSV'
          case,variant,seconds,correct
          smoke,baseline,1.0,true
          smoke,baseline,1.2,true
          smoke,candidate,0.8,true
          smoke,candidate,0.9,true
          CSV
          python skills/uxl-performance-validation/scripts/summarize_runs.py /tmp/uxl_perf_smoke.csv
